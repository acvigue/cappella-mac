# cappella-mac link demo (nrf9151dk/nrf9151/ns)

# Modem firmware with the DECT NR+ PHY API (mfw-nr+ 2.0.0)
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
CONFIG_MODEM_ANTENNA=n

# The MAC, its nRF91 port and the simple MAC thread
CONFIG_TDMA_MAC=y
CONFIG_TDMA_MAC_MAX_POSITIONS=4
CONFIG_TDMA_NRF_DECT_PHY=y
CONFIG_TDMA_NRF_RUNNER=y

# Shell on the DK's VCOM, logging
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Small TF-M: the sample does not use secure services
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# Spinlock owner checks cost the MAC thread measurable CPU
CONFIG_SPIN_VALIDATE=n
