sample:
  name: cappella-mac link demo
  description: Two nRF91 DKs on the TDMA MAC over the DECT NR+ PHY (link, ping, throughput)
common:
  tags: dect
  platform_allow:
    - nrf9151dk/nrf9151/ns
  integration_platforms:
    - nrf9151dk/nrf9151/ns
  harness: console
  harness_config:
    type: one_line
    regex:
      - "link demo: ready"
tests:
  cappella.link_demo:
    build_only: true
