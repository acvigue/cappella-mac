<def format="2">
  <define name="LOG_MODULE_REGISTER(...)" value=""/>
  <define name="LOG_MODULE_DECLARE(...)" value=""/>
  <define name="LOG_ERR(...)" value="((void)0)"/>
  <define name="LOG_WRN(...)" value="((void)0)"/>
  <define name="LOG_INF(...)" value="((void)0)"/>
  <define name="LOG_DBG(...)" value="((void)0)"/>
  <define name="K_MSGQ_DEFINE(name,size,n,align)" value="struct k_msgq name"/>
  <define name="K_MEM_SLAB_DEFINE_STATIC(name,size,n,align)" value="static struct k_mem_slab name"/>
  <define name="K_SEM_DEFINE(name,init,max)" value="struct k_sem name"/>
  <define name="K_MUTEX_DEFINE(name)" value="struct k_mutex name"/>
  <define name="K_THREAD_DEFINE(name,...)" value="k_tid_t name"/>
  <define name="BUILD_ASSERT(...)" value=""/>
  <define name="ARG_UNUSED(x)" value="(void)(x)"/>
  <define name="BIT(n)" value="(1UL &lt;&lt; (n))"/>
  <define name="BIT64(n)" value="(1ULL &lt;&lt; (n))"/>
  <define name="MIN(a,b)" value="(((a) &lt; (b)) ? (a) : (b))"/>
  <define name="MAX(a,b)" value="(((a) &gt; (b)) ? (a) : (b))"/>
  <define name="ARRAY_SIZE(a)" value="(sizeof(a) / sizeof((a)[0]))"/>
  <define name="DIV_ROUND_UP(n,d)" value="(((n) + (d) - 1) / (d))"/>
  <define name="K_NO_WAIT" value="((k_timeout_t){0})"/>
  <define name="K_MSEC(ms)" value="((k_timeout_t){ms})"/>
  <define name="K_SECONDS(s)" value="((k_timeout_t){s})"/>
  <define name="K_TIMEOUT_ABS_TICKS(t)" value="((k_timeout_t){t})"/>
  <define name="K_PRIO_COOP(p)" value="(p)"/>
  <define name="CONFIG_TDMA_NRF_OPS" value="16"/>
  <define name="CONFIG_TDMA_NRF_EVT_QUEUE" value="16"/>
  <define name="CONFIG_TDMA_NRF_QUIET_US" value="650"/>
  <define name="CONFIG_TDMA_NRF_QUIET_LATE_US" value="200"/>
  <define name="CONFIG_TDMA_NRF_RUNNER_STACK_SIZE" value="3072"/>
  <define name="CONFIG_TDMA_NRF_RUNNER_PRIO" value="0"/>
  <define name="CONFIG_TDMA_NRF_LOG_LEVEL" value="3"/>
  <define name="CONFIG_SYS_CLOCK_TICKS_PER_SEC" value="32768"/>
  <define name="CONFIG_SHELL" value="1"/>
</def>
