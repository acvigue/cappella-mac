# cappella-mac as a Zephyr module: list it in your west manifest, or add it with
#   list(APPEND EXTRA_ZEPHYR_MODULES <path to cappella-mac>)
# before find_package(Zephyr), then CONFIG_TDMA_MAC=y (and CONFIG_TDMA_NRF_DECT_PHY=y
# for the nRF91 port).
name: cappella-mac
build:
  cmake: zephyr
  kconfig: zephyr/Kconfig
samples:
  - samples
